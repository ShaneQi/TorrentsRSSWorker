name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fill in KV namespace ids
        env:
          KV_MOVIES_ID: ${{ vars.KV_MOVIES_ID }}
          KV_SHOWS_ID: ${{ vars.KV_SHOWS_ID }}
        run: |
          test -n "$KV_MOVIES_ID" || { echo "::error::Repository variable KV_MOVIES_ID is not set"; exit 1; }
          test -n "$KV_SHOWS_ID" || { echo "::error::Repository variable KV_SHOWS_ID is not set"; exit 1; }
          sed -i "s/__KV_MOVIES_ID__/$KV_MOVIES_ID/; s/__KV_SHOWS_ID__/$KV_SHOWS_ID/" wrangler.toml

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
