name = "torrents"
main = "worker.js"
compatibility_date = "2025-11-01"

# Plain variables (TRACKER_DOWNLOAD_URL, ACCESS_TEAM_DOMAIN, ACCESS_AUD) and
# secrets (PATH_SECRET, TRACKER_DOWNLOAD_TOKEN) are managed in the Cloudflare
# dashboard. keep_vars stops deploys from wiping the dashboard variables.
keep_vars = true

# Routes / custom domains are managed in the dashboard.
workers_dev = false

# The ids are filled in by the deploy workflow from the GitHub repository
# variables KV_MOVIES_ID and KV_SHOWS_ID.
[[kv_namespaces]]
binding = "FEED_MOVIES"
id = "__KV_MOVIES_ID__"

[[kv_namespaces]]
binding = "FEED_SHOWS"
id = "__KV_SHOWS_ID__"
